
services:
  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - MERN

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/devops_db
      NODE_ENV:  development
    ports:
      - "5001:5001"
    depends_on:
      - mongo
    networks:
      - MERN

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - MERN

volumes:
  mongo_data:

networks:
  MERN:
    driver: bridge

