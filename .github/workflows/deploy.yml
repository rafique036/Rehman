
name: CI CD - Deploy to Ubuntu WSL

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Test repository
        run: |
          echo "Source code checked out successfully"
          test -f compose.yaml || test -f docker-compose.yml

      - name: Copy files to Ubuntu WSL
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.WSL_HOST }}
          username: ${{ secrets.WSL_USERNAME }}

          source: "."
          target: "/home/${{ secrets.WSL_USERNAME }}/app"
          rm: false
          exclude: ".git,.github,node_modules,.env"

      - name: Deploy Docker Compose application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.WSL_HOST }}
          username: ${{ secrets.WSL_USERNAME }}
          script: |
            cd ~/app

            docker --version
            docker compose version

            docker compose config
            docker compose up -d --build
            docker compose ps

      - name: Deployment completed
        run: echo "Deployment commands completed successfully"

